[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open-cae-evidence"
version = "0.5.0"
description = "Solver-independent CAE verification with reproducible modal and thermal evidence"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["jsonschema==4.23.0", "jsonschema-specifications==2024.10.1", "referencing==0.35.1", "rpds-py==0.22.3", "attrs==25.1.0"]

[project.optional-dependencies]
plots = ["matplotlib==3.10.0", "numpy==2.2.3", "contourpy==1.3.1", "cycler==0.12.1", "fonttools==4.56.0", "kiwisolver==1.4.8", "packaging==24.2", "pillow==11.1.0", "pyparsing==3.2.1", "python-dateutil==2.9.0.post0", "six==1.17.0"]

[project.scripts]
cae-benchmark = "open_cae_evidence.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
open_cae_evidence = ["schemas/*.json"]
