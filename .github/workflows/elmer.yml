name: Independent Elmer thermal verification
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      upload_evidence:
        description: "Upload full reproducibility evidence (manual runs only)"
        type: boolean
        required: false
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  elmer:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify package availability and install signed build dependencies
        run: |
          mkdir -p evidence/elmer-build
          sudo apt-get update
          apt-cache search '^elmer' > evidence/elmer-build/ubuntu-package-search.txt
          sudo apt-get install --no-install-recommends -y build-essential=12.10ubuntu1 cmake=3.28.3-1build7 gcc-13=13.3.0-6ubuntu2~24.04.1 g++-13=13.3.0-6ubuntu2~24.04.1 gfortran-13=13.3.0-6ubuntu2~24.04.1 libblas-dev=3.12.0-3build1.1 liblapack-dev=3.12.0-3build1.1 calculix-ccx=2.21-1
          dpkg-query -W > evidence/elmer-build/packages.txt
      - name: Clean headless official-source build
        run: |
          export PATH="/usr/bin:/bin:$PATH"
          export CC=gcc-13 CXX=g++-13 FC=gfortran-13
          bash scripts/build-elmer.sh "$RUNNER_TEMP/elmer" "$RUNNER_TEMP/elmer-build"
      - name: Prove actual solver and mesh utility execution
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/elmer/bin:$PATH"
          export ELMER_HOME="$RUNNER_TEMP/elmer"
          export LD_LIBRARY_PATH="$ELMER_HOME/lib"
          mkdir -p evidence/runtime-proof
          cp "$RUNNER_TEMP/elmer-build/source/fem/tests/HeatUniso/"{case.sif,cross.grd,ELMERSOLVER_STARTINFO} evidence/runtime-proof/
          cd evidence/runtime-proof
          ElmerGrid 1 2 cross 2>&1 | tee grid.log
          ElmerSolver case.sif 2>&1 | tee solver.log
          test -s cross/case_t0001.vtu
          test -s TEST.PASSED
          grep -q 'ELMER SOLVER FINISHED' solver.log
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Install the common framework and expose compiled runtime
        run: |
          python -m pip install --disable-pip-version-check '.[plots]'
          echo "$RUNNER_TEMP/elmer/bin" >> "$GITHUB_PATH"
          python -m pip freeze > evidence/elmer-build/python-packages.txt
      - name: All 48 original regression tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee evidence/original-tests.log
      - name: Real Elmer adversarial and interoperability tests
        shell: bash
        env:
          CAE_ELMER_TEST_EVIDENCE: evidence/failure-injection
        run: |
          set -o pipefail
          python -m unittest discover -s tests_elmer -v 2>&1 | tee evidence/elmer-tests.log
      - name: Preserve and replay both modal benchmarks
        run: |
          python -m open_cae_evidence.benchmark --output evidence/benchmark
          python -m open_cae_evidence.benchmark --verify-evidence evidence/benchmark
          python -m open_cae_evidence.benchmark --config benchmarks/cantilever_tip_mass.json --output evidence/tip-mass
          python -m open_cae_evidence.benchmark --verify-evidence evidence/tip-mass
      - name: Source physics, nonnodal convergence and adversarial tests
        shell: bash
        env:
          CAE_SOURCE_TEST_EVIDENCE: evidence/source-failure-injection
        run: |
          set -o pipefail
          python -m unittest discover -s tests_source -v 2>&1 | tee evidence/source-tests.log
      - name: Same slab, both solvers, unchanged physical verification
        run: |
          python -m open_cae_evidence.benchmark --config benchmarks/slab_steady_heat.json --output evidence/thermal
          python -m open_cae_evidence.benchmark --adapter elmer --config benchmarks/slab_steady_heat.json --output evidence/elmer-thermal
      - name: Native archive replay and physical-coordinate comparison
        run: |
          python -m open_cae_evidence.comparison --calculix evidence/thermal --elmer evidence/elmer-thermal --output evidence/comparison
          python -m open_cae_evidence.comparison --calculix evidence/thermal --elmer evidence/elmer-thermal --output evidence/comparison --replay
      - name: Real volumetric-source solves on four meshes
        run: |
          python -m open_cae_evidence.benchmark --config benchmarks/slab_volumetric_source.json --output evidence/source-calculix
          python -m open_cae_evidence.benchmark --adapter elmer --config benchmarks/slab_volumetric_source.json --output evidence/source-elmer
      - name: Source convergence comparison, plots and native replay
        run: |
          python -m open_cae_evidence.source_comparison --calculix evidence/source-calculix --elmer evidence/source-elmer --output evidence/source-comparison
          python -m open_cae_evidence.source_comparison --calculix evidence/source-calculix --elmer evidence/source-elmer --output evidence/source-comparison --replay
      - name: Adversarial audit of excellent nodal agreement
        run: |
          python -m open_cae_evidence.numerical_review --calculix evidence/source-calculix --elmer evidence/source-elmer --failure-root evidence/source-failure-injection --output evidence/numerical-review
          python -m open_cae_evidence.numerical_review --calculix evidence/source-calculix --elmer evidence/source-elmer --failure-root evidence/source-failure-injection --output evidence/numerical-review --replay
      - name: Publish technical reports
        if: always()
        run: |
          for folder in benchmark tip-mass thermal elmer-thermal comparison source-calculix source-elmer source-comparison numerical-review; do
            if test -f "evidence/$folder/report.md"; then
              cat "evidence/$folder/report.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Package full build and execution provenance on request
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.upload_evidence }}
        run: |
          cp "$RUNNER_TEMP/elmer-build/"*.{txt,log} evidence/elmer-build/ 2>/dev/null || true
          if test -f "$RUNNER_TEMP/elmer/source-commit.txt"; then
            tar -czf evidence/elmer-build/compiled-runtime.tar.gz -C "$RUNNER_TEMP/elmer" .
            git -C "$RUNNER_TEMP/elmer-build/source" archive --format=tar.gz --output="$GITHUB_WORKSPACE/evidence/elmer-build/upstream-source.tar.gz" HEAD
          fi
          python3 - <<'PY'
          from pathlib import Path
          from open_cae_evidence.evidence import manifest, write_json
          root = Path('evidence')
          write_json(root / 'manifest.json', manifest(root))
          PY
      - name: Upload evidence on explicit manual request
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.upload_evidence }}
        with:
          name: elmer-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 30
